name: Build Executables

on:
  push:
    tags:
      - "v*" # Trigger on version tags

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            asset_name: brickbreaker-linux
          - os: windows-latest
            asset_name: brickbreaker-windows.exe
          - os: macos-latest
            asset_name: brickbreaker-macos

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name ${{ matrix.asset_name }} src/brickbreaker/__main__.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            brickbreaker-linux/brickbreaker-linux
            brickbreaker-windows.exe/brickbreaker-windows.exe
            brickbreaker-macos/brickbreaker-macos
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
